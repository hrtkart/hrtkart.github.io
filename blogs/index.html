<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs | Academic Journal</title>
  <meta name="description" content="A visual journal of places, conferences, and everyday moments.">
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../assets/base.css">
  <link rel="stylesheet" href="../assets/site.css?v=20261001-squares">
  <script defer src="../assets/site-config.js?v=20261001-squares"></script>
  <script defer src="../assets/site.js"></script>
  <script defer src="../assets/blogs.js?v=20261001-squares"></script>
</head>
<body>
  <main class="container journal-container">
    <nav class="top-nav" aria-label="Main navigation">
      <a class="nav-name" href="../">Home</a>
      <div class="nav-links"><a href="../#publications">Publications</a><a href="./" aria-current="page">Blogs</a>
      <!-- <a href="#footprint">Site Footprint</a> --><button class="theme-toggle" type="button" data-theme-toggle hidden>Theme</button></div>
    </nav>
    <header class="journal-header">
      <p class="eyebrow">Beyond the lab</p><h1>Blogs</h1>
      <p>A visual journal of places, conferences, and everyday moments.</p>
      <p class="muted">Small moments, collected along the way.</p>
    </header>
    <div id="photo-journal"><div class="empty-journal"><span class="empty-icon" aria-hidden="true">▧</span>
      <h2>The journal is just beginning.</h2><p class="muted">Photos and stories will appear here soon.</p></div></div>
    <noscript><p>JavaScript is needed to display the photo journal and open the image viewer.</p></noscript>
    <!-- Site Footprint disabled; uncomment to restore.
    <section class="site-footprint" id="footprint" aria-labelledby="footprint-title">
      <h2 id="footprint-title" class="eyebrow">Site Footprint</h2>
      <div data-visitor-map><p class="muted">Visitor map is not connected yet.</p></div>
    </section>
    -->
  </main>
  <footer class="footer"><a href="../">Back to homepage</a></footer>
  <dialog class="lightbox" aria-label="Photo viewer">
    <div class="lightbox-toolbar"><p id="photo-count" aria-live="polite"></p><button type="button" data-close aria-label="Close photo viewer">✕</button></div>
    <figure><img id="lightbox-image" alt=""><figcaption id="lightbox-caption" aria-live="polite"></figcaption></figure>
    <div class="lightbox-controls"><button type="button" data-previous aria-label="Previous photo">← Previous</button><button type="button" data-next aria-label="Next photo">Next →</button></div>
  </dialog>
</body>
</html>
